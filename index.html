<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F1">
<title>首爾 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, sticky day strip, a timeline rail per day. Ginkgo-gold for "now", palace-teal for map links. */
:root{
  --bg:#F5F5F1; --card:#FFFFFF; --ink:#1E2321; --muted:#6B716D; --faint:#A3A8A4; --line:#E2E3DD;
  --gold:#B7790B; --gold-bg:#FBF1D9; --teal:#1F6E68; --teal-bg:#E3F0EE; --red:#A8402F; --red-bg:#F6E4DF;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:-apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --card:#1C201F; --ink:#ECEDE8; --muted:#A0A6A2; --faint:#6E7471; --line:#2C3230;
  --gold:#E7B44A; --gold-bg:#2E2614; --teal:#6CC2B8; --teal-bg:#16302D; --red:#E58A76; --red-bg:#35201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --card:#1C201F; --ink:#ECEDE8; --muted:#A0A6A2; --faint:#6E7471; --line:#2C3230;
  --gold:#E7B44A; --gold-bg:#2E2614; --teal:#6CC2B8; --teal-bg:#16302D; --red:#E58A76; --red-bg:#35201B; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.clock b{color:var(--gold);font-weight:500}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:16px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.days a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;line-height:1.15}
.days a .d{font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.days a .w{font-size:12px;color:var(--muted)}
.days a.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days a.sel .w{color:var(--bg);opacity:.8}
.days a.today:not(.sel){border-color:var(--gold)}
.days a:focus-visible,button:focus-visible,.map:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.dayhead span{color:var(--muted);font-size:14px}
.sum{color:var(--muted);font-size:14px;margin:0 0 14px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:44px 18px minmax(0,1fr);gap:0 8px;padding:10px 0}
.time{font-family:var(--mono);font-size:14px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--faint);margin:6px 0 0 3px;position:relative;z-index:1}
.body{min-width:0}
.row{display:flex;align-items:flex-start;gap:8px}
.tag{flex:none;font-size:12px;line-height:1;padding:5px 6px;border-radius:6px;margin-top:2px}
.k-food .tag{background:var(--red-bg);color:var(--red)}
.k-go .tag{background:var(--teal-bg);color:var(--teal)}
.k-stay .tag{background:var(--gold-bg);color:var(--gold)}
.k-shop .tag{background:var(--teal-bg);color:var(--teal)}
.title{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.alt{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--faint);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.map{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--teal);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;white-space:nowrap}
.map svg{width:14px;height:14px}
.k-move{padding:4px 0}
.k-move .time{font-size:12px;color:var(--faint)}
.k-move .dot{width:8px;height:8px;border:0;background:var(--faint);margin:6px 0 0 5px}
.k-move .title{font-size:14px;font-weight:400;color:var(--muted)}
.opts{margin:8px 0 0;display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
.opt button{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;font:inherit;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px;cursor:pointer}
.opt .chk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--faint)}
.opt.on{border-color:var(--teal)}
.opt.on .chk{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px var(--card)}
.opt.dim{opacity:.55}
.optlabel{font-size:12px;color:var(--muted);margin-top:8px}
.it.now .dot{border-color:var(--gold);background:var(--gold)}
.it.now .time{color:var(--gold)}
.nowpill{display:inline-block;font-size:12px;color:var(--gold);background:var(--gold-bg);border-radius:6px;padding:2px 7px;margin-top:6px}
.it.past .title,.it.past .time{color:var(--faint)}
.ov{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.ov a{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ov a.today{border-color:var(--gold)}
.ov .d{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.ov .w{font-size:12px;color:var(--muted);display:block;font-family:var(--body);font-weight:400}
.ov .s{font-size:15px}
.ov .m{font-size:13px;color:var(--muted);margin-top:2px}
footer{margin-top:28px;color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:no-preference){.it.now .dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px var(--gold-bg)}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>首爾 2026</h1>
    <p>11 月 1 日 – 5 日 · 五天四夜</p>
    <div class="clock" id="clock">首爾時間 --:--</div>
  </header>
  <nav aria-label="選擇日期"><div class="days" id="days"></div></nav>
  <main id="main"></main>
  <footer>資料來自 Google 表格「Seoul 2026」的快照。地圖按鈕會開 Naver Map。</footer>
</div>

<script>
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const TAG={food:'食',go:'遊',stay:'住',shop:'逛'};
const DAYS=[
 {id:'d1',date:1,wd:'日',sum:'望遠市場 · 入住 · 晚餐',items:[
  {t:'10:00',k:'food',title:'望遠市場',note:'餃子 / 辣椒釀肉 / bagel?',q:'망원시장'},
  {t:'11:30',k:'food',title:'Seodamhoon 韓式中菜',url:'https://naver.me/5apD0wQW'},
  {t:'15:00',k:'stay',title:'Check in'},
  {t:'18:00',k:'food',title:'晚餐',label:'晚餐選擇',opts:[
    {n:'Yeoppgi teokbokki 年糕',q:'엽기떡볶이'},{n:'No more pizza',q:'노모어피자'},
    {n:'Purada chicken',q:'푸라닭'},{n:'60 chicken',q:'60계치킨'}]}
 ]},
 {id:'d2',date:2,wd:'一',sum:'現代百貨 · 汝矣島漢江野餐',items:[
  {t:'09:00',k:'food',title:'Jo&Dawson 早餐',note:'french toast，或…',q:'Jo&Dawson'},
  {t:'11:00',k:'food',title:'Eel'},
  {t:'12:30',k:'go',title:'Olympic Park',alt:true,q:'올림픽공원'},
  {t:'13:30',k:'shop',title:'Hyundai department store 現代百貨公司',note:'Foodcourt',q:'더현대 서울',spots:[
    {n:'London Bagel Museum',q:'London Bagel Museum'},{n:'Artist Bakery',q:'아티스트베이커리'}]},
  {t:'14:00',k:'go',title:'汝矣島漢江公園野餐',note:'Picnic + 單車',q:'여의도한강공원'},
  {t:'16:30',k:'move',title:'往明洞 或 Ipark Mall（有 Emart）'},
  {t:'18:00',k:'food',title:'Daylit 韓式 fusion',note:'晚餐',q:'daylit'},
  {t:'19:00',k:'shop',title:'Lotte zmart',note:'晚餐前或後',q:'롯데마트'}
 ]},
 {id:'d3',date:3,wd:'二',sum:'首爾林秋景 · 聖水散步',items:[
  {t:'09:00',k:'food',title:'Breakfast'},
  {t:'10:30',k:'move',title:'往聖水 / 首爾林'},
  {t:'11:30',k:'food',title:'午餐',label:'午餐選擇',opts:[{n:'Manbae 蒸豬肉',q:'manbae 성수'}]},
  {t:'13:00',k:'go',title:'Snoopy forest + 首爾林',note:'Autumn walk walk · 累了就去 cafe',q:'서울숲'},
  {t:'15:30',k:'go',title:'聖水 walk walk',q:'성수동',spots:[
    {n:'Standard bread',q:'스탠다드브레드 성수'},{n:'Eteure salt bread',q:'eteure'},
    {n:'Mamam gelato',q:'mamam gelato'},{n:"Kim's deli",q:"Kim's deli 성수"}]},
  {t:'17:30',k:'food',title:'Jojo kalguksu 蜆肉刀削麵',note:'晚餐',q:'조조칼국수'}
 ]},
 {id:'d4',date:4,wd:'三',sum:'安國 · 景福宮 · 廣藏市場',items:[
  {t:'09:00',k:'food',title:'Isaac toast 早餐?',q:'이삭토스트'},
  {t:'10:00',k:'move',title:'往安國'},
  {t:'11:00',k:'food',title:'午餐',label:'午餐選擇',opts:[
    {n:'土俗村 人蔘雞',url:'https://naver.me/FW6hFEuf'},{n:'Koong 米芝蓮餃子',url:'https://naver.me/5OQyTZvB'},
    {n:'Moguok 人蔘雞',q:'moguok'},{n:'Shilla jemyeon',q:'shilla jemyeon'}]},
  {t:'12:30',k:'go',title:'景福宮附近行行',q:'경복궁',spots:[
    {n:'北村韓屋？',q:'북촌한옥마을'},{n:'Garlic boy?',q:'garlic boy'}]},
  {t:'14:00',k:'move',title:'往廣藏市場',q:'광장시장'},
  {t:'14:30',k:'go',title:'溪邊 / 明洞',alt:true,q:'청계천'},
  {t:'16:00',k:'move',title:'返弘大'},
  {t:'17:30',k:'food',title:'Mogumong 燒肉',note:'晚餐',q:'mogumong'}
 ]},
 {id:'d5',date:5,wd:'四',sum:'退房 · 寄存行李 · 機場',items:[
  {t:'09:30',k:'food',title:'Jo&Dawson french toast',q:'Jo&Dawson'},
  {t:'11:00',k:'stay',title:'Check out'},
  {t:'11:30',k:'food',title:'午餐',label:'午餐選擇',opts:[{n:'五香豬手',q:'오향족발'},{n:'Myth',q:'myth 족발'}]},
  {t:'14:30',k:'stay',title:'Zim Carry 寄存行李',q:'짐캐리'},
  {t:'15:00',k:'go',title:'Inspire?',q:'인스파이어'},
  {t:'16:00',k:'stay',title:'酒店接送往機場',note:'Airport pick up from hotel'}
 ]}
];
const mapURL=o=>o.url||(o.q?'https://map.naver.com/p/search/'+encodeURIComponent(o.q):null);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapBtn=o=>{const u=mapURL(o);return u?`<a class="map" href="${u}" target="_blank" rel="noopener" aria-label="在 Naver Map 開啟 ${esc(o.n||o.title)}">${PIN}地圖</a>`:''};

let picks={};try{picks=JSON.parse(localStorage.getItem('seoul26-picks')||'{}')}catch(e){}
const savePicks=()=>{try{localStorage.setItem('seoul26-picks',JSON.stringify(picks))}catch(e){}};

function seoulNow(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {y:+p.year,m:+p.month,d:+p.day,mins:(+p.hour)*60+(+p.minute),hm:p.hour+':'+p.minute};
}
const toMin=t=>{const[a,b]=t.split(':');return a*60+ +b};
function todayId(){const n=seoulNow();if(n.y===2026&&n.m===11&&n.d>=1&&n.d<=5)return 'd'+n.d;return null}

function renderNav(sel){
  const tid=todayId();
  document.getElementById('days').innerHTML=
    `<a href="#overview" class="${sel==='overview'?'sel':''}" aria-current="${sel==='overview'}"><span class="d">總覽</span><span class="w">五天</span></a>`+
    DAYS.map(d=>`<a href="#${d.id}" class="${sel===d.id?'sel':''} ${tid===d.id?'today':''}" aria-current="${sel===d.id}"><span class="d">11/${d.date}</span><span class="w">${tid===d.id?'今天':'星期'+d.wd}</span></a>`).join('');
}

function itemHTML(day,it,i,state){
  const cls=`it k-${it.k} ${state}`;
  let h=`<li class="${cls}"><div class="time">${it.t}</div><div class="dot"></div><div class="body"><div class="row">`;
  if(it.k!=='move')h+=`<span class="tag">${TAG[it.k]}</span>`;
  h+=`<div class="title">${it.alt?'<span class="alt">或</span>':''}${esc(it.title)}</div>${mapBtn(it)}</div>`;
  if(it.note)h+=`<div class="note">${esc(it.note)}</div>`;
  if(it.opts){
    const key=day.id+'-'+i, chosen=picks[key];
    h+=`<div class="optlabel">${esc(it.label)}${it.opts.length>1?' · 點一下選定':''}</div><div class="opts">`;
    it.opts.forEach((o,j)=>{
      const on=chosen===j, dim=chosen!==undefined&&!on;
      h+=`<div class="opt ${on?'on':''} ${dim?'dim':''}"><button type="button" data-key="${key}" data-j="${j}" aria-pressed="${on}"><span class="chk"></span><span>${esc(o.n)}</span></button>${mapBtn(o)}</div>`;
    });
    h+='</div>';
  }
  if(it.spots){
    h+='<div class="opts">'+it.spots.map(o=>`<div class="opt"><span style="flex:1;min-width:0;padding:6px 0;font-size:15px">${esc(o.n)}</span>${mapBtn(o)}</div>`).join('')+'</div>';
  }
  if(state==='now')h+='<div><span class="nowpill">現在大約在這裡</span></div>';
  return h+'</div></li>';
}

function renderDay(id){
  const day=DAYS.find(d=>d.id===id);
  const n=seoulNow(), isToday=todayId()===id;
  let nowIdx=-1;
  if(isToday)day.items.forEach((it,i)=>{if(toMin(it.t)<=n.mins)nowIdx=i});
  const tripPast=n.y===2026&&n.m===11&&n.d>day.date;
  document.getElementById('main').innerHTML=
    `<div class="dayhead"><h2>11 月 ${day.date} 日</h2><span>星期${day.wd}${isToday?' · 今天':''}</span></div><p class="sum">${esc(day.sum)}</p>`+
    `<ol class="tl">${day.items.map((it,i)=>itemHTML(day,it,i,tripPast?'past':(isToday?(i===nowIdx?'now':(i<nowIdx?'past':'')):''))).join('')}</ol>`;
  const nowEl=document.querySelector('.it.now');
  if(nowEl&&!renderDay.scrolled){renderDay.scrolled=true;setTimeout(()=>nowEl.scrollIntoView({block:'center',behavior:'smooth'}),150)}
}

function renderOverview(){
  const tid=todayId();
  document.getElementById('main').innerHTML=`<div class="dayhead"><h2>五天總覽</h2></div><ul class="ov">`+
    DAYS.map(d=>{
      const food=d.items.filter(i=>i.k==='food').length;
      return `<li><a href="#${d.id}" class="${tid===d.id?'today':''}"><span class="d">11/${d.date}<span class="w">星期${d.wd}${tid===d.id?' · 今天':''}</span></span><span style="min-width:0"><div class="s">${esc(d.sum)}</div><div class="m">${d.items.length} 個行程 · ${food} 餐</div></span></a></li>`;
    }).join('')+'</ul>';
}

function route(){
  let h=location.hash.slice(1);
  if(h!=='overview'&&!DAYS.some(d=>d.id===h))h=todayId()||'overview';
  renderNav(h);
  h==='overview'?renderOverview():renderDay(h);
}

document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('button[data-key]');if(!b)return;
  const k=b.dataset.key,j=+b.dataset.j;
  if(picks[k]===j)delete picks[k];else picks[k]=j;
  savePicks();route();
});

function tick(){const n=seoulNow();document.getElementById('clock').innerHTML=`首爾時間 <b>${n.hm}</b>`}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});
tick();route();
setInterval(()=>{tick();const h=location.hash.slice(1)||todayId();if(h&&h===todayId())route()},60000);
</script>

</body>
</html>
